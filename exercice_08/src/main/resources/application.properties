# Valeurs par défaut = dev local ; surchargées par variables d'environnement dans Docker
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kennel}
spring.datasource.username=${DB_USER:kennel}
spring.datasource.password=${DB_PASSWORD:kennelpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
